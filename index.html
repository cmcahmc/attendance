<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Holy Methodist Church - Attendance</title>
    <link rel="icon" type="image/png" href="https://file.garden/amiKlgzZ2GoYPWGN/cmcalogo.png">
    <style>
        /* ... (same styles as before, plus these new ones) ... */
        
        /* Modal Popup Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: white;
            border-radius: 24px;
            padding: 30px 28px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease-out;
        }
        .modal-box .modal-icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 8px;
        }
        .modal-box h3 {
            font-size: 20px;
            color: #1a2634;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .modal-box p {
            font-size: 15px;
            color: #4a5568;
            margin: 0 0 16px 0;
            text-align: center;
            line-height: 1.5;
        }
        .modal-box .previous-data {
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px 16px;
            margin: 12px 0 16px 0;
            font-size: 14px;
            color: #2c3e50;
            border-left: 4px solid #c9a84c;
        }
        .modal-box .previous-data strong {
            color: #1a472a;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .modal-actions button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-actions .btn-cancel {
            background: #e8edf3;
            color: #4a5568;
        }
        .modal-actions .btn-cancel:hover {
            background: #d5dce6;
        }
        .modal-actions .btn-confirm {
            background: #1a472a;
            color: white;
        }
        .modal-actions .btn-confirm:hover {
            background: #0f3320;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ... (same header and form content as before) ... -->
</div>

<!-- ===== DUPLICATE WARNING MODAL ===== -->
<div id="duplicateModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon">⚠️</div>
        <h3>Duplicate Submission Detected</h3>
        <p id="duplicateMessage">A submission from this person was already recorded.</p>
        <div id="previousDataDisplay" class="previous-data" style="display: none;">
            <strong>Previous submission:</strong><br>
            <span id="previousAdults"></span><br>
            <span id="previousChildren"></span>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="cancelDuplicate()">Cancel</button>
            <button class="btn-confirm" onclick="confirmDuplicate()">Submit Anyway</button>
        </div>
    </div>
</div>

<script>
    // ============================================
    // CONFIGURATION - UPDATE THIS URL!
    // ============================================
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyvldogdc0QX1_LIaaaEJL1inVhmoJkQy8WwZyuNvoRjzrZSGPiyycifJRpH-Cg_RU/exec';
    
    // ============================================
    // MAIN APPLICATION WITH DUPLICATE HANDLING
    // ============================================
    
    // ... (same DOM elements as before) ...
    
    // Duplicate handling variables
    let pendingData = null;
    let isSubmitting = false;

    // ... (same loadSavedData, loadSavedAttendees, saveData, clearSavedData, updateCounts functions) ...
    
    // ===== UPDATED SUBMISSION HANDLER =====
    async function handleSubmission() {
        const name = submitterInput.value.trim();
        const phone = phoneInput.value.trim();
        const adults = adultsInput.value.trim();
        const children = childrenInput.value.trim();
        
        console.log('📤 Submitting attendance for:', name);
        
        // Validate
        if (!name) {
            showStatus('❌ Please enter your name', 'error');
            submitterInput.focus();
            return;
        }
        
        if (!phone) {
            showStatus('❌ Please enter your phone number', 'error');
            phoneInput.focus();
            return;
        }
        
        // Save data for potential resubmission
        pendingData = {
            submitter: name,
            phone: phone,
            adults: adults,
            children: children
        };
        
        // Save data locally
        saveData(name, phone, adults, children);
        
        // Disable button
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading-spinner"></span> Checking...';
        
        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(pendingData)
            });
            
            const result = await response.json();
            
            // Check for duplicate response
            if (result.result === 'duplicate') {
                console.log('⚠️ Duplicate detected:', result);
                showDuplicateWarning(result);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="whatsapp-icon">📱</span> Sign In Now';
                return;
            }
            
            // Handle success
            if (result.result === 'success') {
                handleSuccess(result.message, name, phone, adults, children);
            } else {
                showStatus('❌ ' + result.message, 'error');
            }
            
        } catch (error) {
            console.error('❌ Submission error:', error);
            // With no-cors, "Failed to fetch" often means success
            if (error.message && error.message.includes('Failed to fetch')) {
                const adultCount = adults ? adults.split(/[\n,;]+/).filter(n => n.trim() !== '').length + 1 : 1;
                const childCount = children ? children.split(/[\n,;]+/).filter(n => n.trim() !== '').length : 0;
                showStatus(`✅ Recorded: ${adultCount} adult(s), ${childCount} child(ren)`, 'success');
                updateUIAfterSuccess(name, phone);
            } else {
                showStatus('❌ Error: ' + error.message, 'error');
            }
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span class="whatsapp-icon">📱</span> Sign In Now';
        }
    }

    // ===== DUPLICATE WARNING FUNCTIONS =====
    
    function showDuplicateWarning(result) {
        const modal = document.getElementById('duplicateModal');
        const messageEl = document.getElementById('duplicateMessage');
        const previousDataEl = document.getElementById('previousDataDisplay');
        const previousAdultsEl = document.getElementById('previousAdults');
        const previousChildrenEl = document.getElementById('previousChildren');
        
        // Set the message
        messageEl.textContent = result.message;
        
        // Show previous data if it exists
        if (result.previous_adults || result.previous_children) {
            previousDataEl.style.display = 'block';
            previousAdultsEl.textContent = result.previous_adults ? `👤 Adults: ${result.previous_adults}` : '';
            previousChildrenEl.textContent = result.previous_children ? `🧒 Children: ${result.previous_children}` : '';
        } else {
            previousDataEl.style.display = 'none';
        }
        
        // Show the modal
        modal.classList.add('show');
    }
    
    function cancelDuplicate() {
        document.getElementById('duplicateModal').classList.remove('show');
        pendingData = null;
        showStatus('❌ Submission cancelled', 'info');
    }
    
    async function confirmDuplicate() {
        document.getElementById('duplicateModal').classList.remove('show');
        
        if (!pendingData) return;
        
        console.log('📤 Re-submitting (forced):', pendingData);
        
        // Disable button
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading-spinner"></span> Submitting...';
        
        try {
            // Add a flag to bypass duplicate check
            const dataWithForce = { ...pendingData, force_submit: true };
            
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(dataWithForce)
            });
            
            const result = await response.json();
            
            if (result.result === 'success') {
                const adults = pendingData.adults || '';
                const children = pendingData.children || '';
                const adultCount = adults ? adults.split(/[\n,;]+/).filter(n => n.trim() !== '').length + 1 : 1;
                const childCount = children ? children.split(/[\n,;]+/).filter(n => n.trim() !== '').length : 0;
                showStatus(`✅ Recorded: ${adultCount} adult(s), ${childCount} child(ren)`, 'success');
                updateUIAfterSuccess(pendingData.submitter, pendingData.phone);
                
                // Clear fields if auto-save is off
                if (!autoSaveCheckbox.checked) {
                    adultsInput.value = '';
                    childrenInput.value = '';
                    updateCounts();
                }
            } else {
                showStatus('❌ ' + result.message, 'error');
            }
            
        } catch (error) {
            console.error('❌ Re-submission error:', error);
            if (error.message && error.message.includes('Failed to fetch')) {
                const adults = pendingData.adults || '';
                const children = pendingData.children || '';
                const adultCount = adults ? adults.split(/[\n,;]+/).filter(n => n.trim() !== '').length + 1 : 1;
                const childCount = children ? children.split(/[\n,;]+/).filter(n => n.trim() !== '').length : 0;
                showStatus(`✅ Recorded: ${adultCount} adult(s), ${childCount} child(ren)`, 'success');
                updateUIAfterSuccess(pendingData.submitter, pendingData.phone);
            } else {
                showStatus('❌ Error: ' + error.message, 'error');
            }
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span class="whatsapp-icon">📱</span> Sign In Now';
            pendingData = null;
        }
    }

    // ===== HELPER FUNCTIONS =====
    
    function handleSuccess(message, name, phone, adults, children) {
        const adultCount = adults ? adults.split(/[\n,;]+/).filter(n => n.trim() !== '').length + 1 : 1;
        const childCount = children ? children.split(/[\n,;]+/).filter(n => n.trim() !== '').length : 0;
        showStatus(`✅ Recorded: ${adultCount} adult(s), ${childCount} child(ren)`, 'success');
        console.log('✅ Submission successful!', { adultCount, childCount });
        
        if (!autoSaveCheckbox.checked) {
            adultsInput.value = '';
            childrenInput.value = '';
            updateCounts();
        }
        
        updateUIAfterSuccess(name, phone);
    }
    
    function updateUIAfterSuccess(name, phone) {
        savedInfoText.textContent = `👤 ${name} · 📞 ${phone}`;
        savedInfo.classList.add('show');
        nameBadge.style.display = 'inline';
        phoneBadge.style.display = 'inline';
    }

    // ... (rest of the functions: showStatus, etc.)
</script>
</body>
</html>
